<title>Recon Call Graph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: toolbar on top, graph canvas (pan/zoom) left, detail panel right; stacks on phones */
:root {
  --bg: #f3f5f6; --panel: #ffffff; --ink: #172026; --muted: #5d6b75; --line: #dde3e7;
  --node: #ffffff; --node-line: #c9d2d8; --edge: #b4bfc6; --hi: #0f6d8c; --up: #b4541a;
  --dim: 0.16; --grid: #e6eaed; --chip: #eef2f4;
  --g-cli: #2f6fb3; --g-conn: #7a4fb4; --g-config: #a2468b; --g-sql: #0f8a8a; --g-dialect: #5c8f2e;
  --g-compare: #b07a12; --g-engine: #c4472b; --g-report: #3d7f5a;
  --g-web: #1d5f7a; --g-route: #b0336b; --g-jobs: #6a5acd; --g-results: #8a6d3b; --g-browser: #4a5560;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171b; --panel: #172026; --ink: #e3e9ed; --muted: #95a3ad; --line: #26323a;
    --node: #1b252c; --node-line: #34434d; --edge: #45545e; --hi: #4fc0e0; --up: #f0965a;
    --grid: #1a2329; --chip: #222d34;
    --g-cli: #6aa6e8; --g-conn: #a98be0; --g-config: #d97cbf; --g-sql: #4cc4c4; --g-dialect: #93c463;
    --g-compare: #e0ad4a; --g-engine: #f07a5e; --g-report: #6cc08f;
    --g-web: #5fb0d0; --g-route: #e57aa6; --g-jobs: #a99bf0; --g-results: #c9a46a; --g-browser: #9aa6b0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171b; --panel: #172026; --ink: #e3e9ed; --muted: #95a3ad; --line: #26323a;
  --node: #1b252c; --node-line: #34434d; --edge: #45545e; --hi: #4fc0e0; --up: #f0965a;
  --grid: #1a2329; --chip: #222d34;
  --g-cli: #6aa6e8; --g-conn: #a98be0; --g-config: #d97cbf; --g-sql: #4cc4c4; --g-dialect: #93c463;
  --g-compare: #e0ad4a; --g-engine: #f07a5e; --g-report: #6cc08f;
  --g-web: #5fb0d0; --g-route: #e57aa6; --g-jobs: #a99bf0; --g-results: #c9a46a; --g-browser: #9aa6b0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
       padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
       padding-block: 18px 28px; }
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 24px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.stats { margin-left: auto; display: flex; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.stats b { color: var(--ink); font-size: 16px; display: block; font-variant-numeric: tabular-nums; }

.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--sans); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 13px var(--sans);
       padding: 6px 11px; border-radius: 8px; cursor: pointer; }
.btn:hover, .seg button:hover { color: var(--ink); }
.btn[aria-pressed="true"] { border-color: var(--hi); color: var(--hi); box-shadow: inset 0 0 0 1px var(--hi); }
input[type=search] { font: 13px var(--mono); padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
                     background: var(--panel); color: var(--ink); width: 220px; max-width: 100%; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.canvas { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
          height: min(78vh, 820px); min-height: 420px; min-width: 0;
          background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 18px 18px; }
svg#g { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
svg#g.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel);
               color: var(--ink); font: 600 15px var(--sans); cursor: pointer; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--panel);
        padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }

/* graph marks */
.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; transition: opacity .15s; }
.edge.proc, .edge.file, .edge.http { stroke-dasharray: 5 4; }
.edge.down { stroke: var(--hi); stroke-width: 2; }
.edge.up { stroke: var(--up); stroke-width: 2; }
.node rect { fill: var(--node); stroke: var(--node-line); stroke-width: 1; transition: opacity .15s; }
.node text { font: 500 12px var(--mono); fill: var(--ink); }
.node .ln { font: 400 10px var(--mono); fill: var(--muted); }
.node { cursor: pointer; transition: opacity .15s; }
.node:hover rect { stroke: var(--ink); }
.node.sel rect { stroke: var(--hi); stroke-width: 2.4; }
.node.down rect { stroke: var(--hi); stroke-width: 1.6; }
.node.up rect { stroke: var(--up); stroke-width: 1.6; }
.dimmed .node:not(.sel):not(.down):not(.up), .dimmed .edge:not(.down):not(.up) { opacity: var(--dim); }
.arrow path { fill: var(--edge); } .arrow-down path { fill: var(--hi); } .arrow-up path { fill: var(--up); }
.elabel { font: 500 10px var(--mono); fill: var(--muted); }

/* panel */
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px;
        min-width: 0; max-height: min(78vh, 820px); overflow: auto; }
aside h2 { margin: 0; font: 600 16px var(--mono); word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.desc { margin: 0; }
.list h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.list h3 i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: 12px var(--mono); border: 1px solid var(--line); background: var(--bg); color: var(--ink);
                padding: 3px 8px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chips button:hover { border-color: var(--ink); }
.chips em { color: var(--muted); font-style: normal; font-size: 11px; }
.none { color: var(--muted); font-size: 13px; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; font-size: 12px; }
.legend button { all: unset; display: flex; gap: 7px; align-items: center; cursor: pointer; padding: 2px 0; color: var(--ink); }
.legend button:focus-visible { outline: 2px solid var(--hi); }
.legend .n { color: var(--muted); font-family: var(--mono); margin-left: auto; padding-right: 6px; }
.keys { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.keys div { display: flex; gap: 10px; align-items: center; }
.keys svg { flex: none; }
.trace-note { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--chip); }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .canvas { height: 62vh; min-height: 360px; }
  aside { max-height: none; }
  .stats { margin-left: 0; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Recon Call Graph</h1>
      <div class="sub">Who calls whom in <code>recon.py</code> and <code>app.py</code>. Click a function to follow its calls.</div>
    </div>
    <div class="stats" aria-label="Graph size">
      <div><b id="s-nodes">0</b>functions shown</div>
      <div><b id="s-edges">0</b>calls shown</div>
    </div>
  </header>

  <div class="bar" role="toolbar" aria-label="Graph controls">
    <span class="lbl">Show</span>
    <div class="seg" id="views">
      <button id="v-all" data-view="all" aria-pressed="true">Whole system</button>
      <button id="v-engine" data-view="engine" aria-pressed="false">Engine · recon.py</button>
      <button id="v-web" data-view="web" aria-pressed="false">Web app · app.py</button>
    </div>
    <span class="lbl">Trace</span>
    <button class="btn" id="t-run" data-trace="run" aria-pressed="false">Normal run</button>
    <button class="btn" id="t-check" data-trace="check" aria-pressed="false">--check</button>
    <button class="btn" id="t-browser" data-trace="browser" aria-pressed="false">Run from browser</button>
    <input type="search" id="find" list="names" placeholder="Find a function…" aria-label="Find a function">
    <datalist id="names"></datalist>
  </div>

  <div class="main">
    <div class="canvas">
      <svg id="g" role="img" aria-label="Function call graph"></svg>
      <div class="zoom">
        <button id="z-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="z-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="z-fit" title="Fit to screen" aria-label="Fit to screen">⤢</button>
      </div>
      <div class="hint">Click a function to zoom in · drag to pan · scroll to zoom · ⤢ shows everything</div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
(function () {
"use strict";
/* ---------------------------------------------------------------- data */
var GROUPS = {
  cli:     { name: "Entry & CLI",            file: "recon.py" },
  conn:    { name: "Connections",            file: "recon.py" },
  config:  { name: "Config checks",          file: "recon.py" },
  sql:     { name: "SQL builders",           file: "recon.py" },
  dialect: { name: "SQL dialects",           file: "recon.py" },
  compare: { name: "Normalise & compare",    file: "recon.py" },
  engine:  { name: "Reconciler engine",      file: "recon.py" },
  report:  { name: "Reports",                file: "recon.py" },
  web:     { name: "Startup & security",     file: "app.py" },
  route:   { name: "Pages & API",            file: "app.py" },
  jobs:    { name: "Job runner",             file: "app.py" },
  results: { name: "Results & config",       file: "app.py" },
  browser: { name: "Browser actions",        file: "templates" }
};
// [id, label, group, line, description]
var N = [
  ["r.main", "recon.main()", "cli", 1153, "CLI entry point. Parses arguments, loads .env, reads the config, then: --check tests connections; --show-sql prints SQL; otherwise runs every table in parallel and writes Excel, HTML, CSV, JSON and the RECON_* tables. Exit code 0 matched, 1 differences, 2 error."],
  ["r.load_env_file", "load_env_file()", "cli", 1131, "Reads KEY=VALUE lines from .env into the environment without overriding variables already set. Used by both recon.py and app.py."],
  ["r.check_connections", "check_connections()", "cli", 1113, "For --check: opens every connection, runs SELECT 1 (FROM DUAL on Oracle) and prints OK or FAIL with a plain-language fix."],
  ["r.connection_hint", "connection_hint()", "cli", 1068, "Turns a driver error (unknown host, missing ODBC driver, wrong password, wrong service name, timeout, thick mode) into the fix to apply."],

  ["r.Database", "Database()", "conn", 166, "One configured connection. Picks the SQL dialect and creates a pooled SQLAlchemy engine (SQLite files are opened read-only per query)."],
  ["r.Database._url", "Database._url()", "conn", 211, "Builds the connection URL from the config fields (or uses url:), refusing any field still set to xxxx. Passwords are escaped by URL.create."],
  ["r.Database._password", "Database._password()", "conn", 199, "Reads the password from the environment variable named in password_env; clear error if missing or still a placeholder."],
  ["r.Database.query", "Database.query()", "conn", 250, "Runs one read-only SELECT and returns all rows. Every database round trip in the tool goes through here."],
  ["r.Database.write_tables", "Database.write_tables()", "conn", 261, "Appends RECON_SUMMARY, RECON_PARTITIONS and RECON_DIFFERENCES in one transaction: a run is saved completely or not at all."],

  ["r.build_spec", "build_spec()", "config", 360, "Validates one tables: block and returns a TableSpec: maps source/target names for keys, columns and partition, applies defaults and combines filters."],
  ["r._check_placeholders", "_check_placeholders()", "config", 328, "Walks a table block and stops on the first value still set to xxxx, naming it."],
  ["r.is_placeholder", "is_placeholder()", "config", 324, "True for strings made only of x/X, three or more long."],
  ["r._check_ident", "_check_ident()", "config", 347, "Requires a safe table/column name (name, schema.table, \"quoted\" or [bracketed]). Blocks SQL injection through names."],
  ["r._check_filter", "_check_filter()", "config", 354, "Rejects filters containing ; -- or /* so a filter can only be a single condition."],
  ["r._pairs", "_pairs()", "config", 317, "Normalises keys: into (source_name, target_name) pairs from a list or a mapping."],

  ["r.profile_sql", "profile_sql()", "sql", 495, "Level 1/2 query: one GROUP BY partition per side computing all metrics in a single scan."],
  ["r.bucket_sql", "bucket_sql()", "sql", 509, "Same metrics grouped by key bucket inside one partition (level 3 drill-down)."],
  ["r.fetch_sql", "fetch_sql()", "sql", 517, "Selects key and compared columns for rows in the given buckets of one partition."],
  ["r._metric_exprs", "_metric_exprs()", "sql", 461, "The single definition of every metric: per-row expressions, their aggregates and readable names (sum(PREMIUM), text_sig(STATUS) …)."],
  ["r._part_expr", "_part_expr()", "sql", 438, "Partition key expression: day or month text, or the raw column for grain: value."],
  ["r._where", "_where()", "sql", 433, "Joins the side's filter and extra conditions into a WHERE clause."],
  ["r.partition_filter", "partition_filter()", "sql", 443, "WHERE condition for one partition, as an index-friendly range (col >= start AND col < next)."],
  ["r._lit", "_lit()", "sql", 425, "Python value to SQL literal (NULL, number, or quoted text with ' escaped)."],

  ["r.text_len", "Dialect.text_len()", "dialect", 72, "SQL for the length of trimmed text with '' treated as NULL. Summed per partition to catch truncation and value changes."],
  ["r.text_sig", "Dialect.text_sig()", "dialect", 76, "SQL for a cheap content signature (codes of 1st, 2nd and last character) to catch same-length changes like LAPSED → PAIDUP."],
  ["r.bucket_expr", "Dialect.bucket_expr()", "dialect", 85, "SQL that puts each key in bucket 0..n-1 identically on every engine: MOD for number keys, weighted last-4-character codes for text keys."],
  ["r.primitives", "Dialect primitives ×16", "dialect", 54, "Small per-engine SQL pieces: mod, trim, length, ascii, substr, concat, right, to_day, fmt_day, fmt_month, date_lit, num, bigint, upper, epoch_days, epoch_secs. Oracle, SQL Server, PostgreSQL, MySQL and SQLite each override what differs. Reached through side.d, chosen from type: in the config."],

  ["r._metric_equal", "_metric_equal()", "compare", 562, "Decides if one metric matches: sums allow rounding + tolerance × rows, dates compare as text, everything else must be exact."],
  ["r._to_metric_map", "_to_metric_map()", "compare", 583, "Profile rows → {partition: (raw value, {metric: value})}."],
  ["r._norm_scalar", "_norm_scalar()", "compare", 535, "Makes one value comparable across drivers: Decimal → float, NaN → None, dates → ISO text, '' → None."],
  ["r._norm_date_str", "_norm_date_str()", "compare", 552, "Formats any date-like value as YYYY-MM-DD (or with time)."],
  ["r._norm_frame", "_norm_frame()", "compare", 595, "Cleans fetched rows with the same rules the SQL metrics use: trim, '' → NULL, round to scale, upper-case if ignore_case, date only."],

  ["r.run", "Reconciler.run()", "engine", 679, "Public entry for one table. Catches any error so one failing table never stops the others; records duration."],
  ["r._run", "Reconciler._run()", "engine", 691, "Main algorithm: profile both sides, compare every partition, then for mismatches drill down, spot check and merge moved rows."],
  ["r._both", "Reconciler._both()", "engine", 673, "Runs the source and target query at the same time in a 2-thread pool."],
  ["r._filters", "Reconciler._filters()", "engine", 768, "Partition WHERE condition for each side (names and dialects can differ)."],
  ["r._drill", "Reconciler._drill()", "engine", 773, "Level 3 for one partition: split into buckets, compare bucket fingerprints, fetch only differing buckets in batches."],
  ["r._spot_check", "Reconciler._spot_check()", "engine", 806, "Row-compares a few random buckets of matched partitions every run, to catch what aggregates cannot see."],
  ["r._fetch_and_diff", "Reconciler._fetch_and_diff()", "engine", 830, "Fetch rows of the given buckets from both sides in parallel, normalise them, diff them."],
  ["r._diff", "Reconciler._diff()", "engine", 850, "Row comparison: duplicate keys, outer merge on keys (MISSING / EXTRA), then per-column VALUE_MISMATCH."],
  ["r._record", "Reconciler._record()", "engine", 843, "Counts a difference and keeps the detail row while under max_diff_rows."],
  ["r._merge_moved_rows", "Reconciler._merge_moved_rows()", "engine", 741, "A key MISSING in one partition and EXTRA in another becomes one MOVED_PARTITION row."],

  ["r.build_frames", "build_frames()", "report", 888, "Results → summary, partitions and differences DataFrames. The single place report columns are defined."],
  ["r.db_frame", "db_frame()", "report", 925, "Prepares a frame for the database: RUN_TIME, reserved-word-safe UPPER names, NULLs, 4,000-char cap."],
  ["r.write_json", "write_json()", "report", 943, "Writes recon_<run_id>.json atomically. The web app reads this file."],
  ["r.write_excel", "write_excel()", "report", 957, "Excel report with four sheets and status colours. Forces data cells to text (no formula injection)."],
  ["r.write_html", "write_html()", "report", 988, "Self-contained HTML report; all values escaped."],

  ["a.main", "app.main()", "web", 530, "Web app entry: loads .env, parses logins, refuses network access without logins, marks stale jobs INTERRUPTED, starts the server."],
  ["a._parse_users", "_parse_users()", "web", 257, "Parses UI_USERS / UI_VIEWERS (name:pass,name:pass)."],
  ["a.guard", "guard()", "web", 301, "Runs before every request: host check, login lockout, HTTP Basic login, same-origin check on POST, viewers cannot POST."],
  ["a._host_allowed", "_host_allowed()", "web", 273, "Blocks DNS rebinding: only localhost (no logins) or UI_ALLOWED_HOSTS names."],
  ["a._too_many_failures", "_too_many_failures()", "web", 287, "True after 10 wrong passwords from one IP within 15 minutes."],
  ["a._record_failure", "_record_failure()", "web", 295, "Notes a failed login for the lockout window."],
  ["a.security_headers", "security_headers()", "web", 340, "After every request: CSP, X-Frame-Options DENY, nosniff, no-store on pages."],
  ["a.common", "common()", "web", 355, "Gives every template the user, role, running job and config path."],

  ["a.dashboard", "dashboard()  GET /", "route", 364, "Tables with latest status, KPI counts, last connection test and recent activity."],
  ["a.run", "run()  POST /run", "route", 383, "Keeps only table names that exist in the config, validates the level, starts a run job, redirects to its live log."],
  ["a.check", "check()  POST /check", "route", 397, "Starts a connection test job (recon.py --check)."],
  ["a.job_page", "job_page()  GET /jobs/<id>", "route", 405, "Live log page; its script polls job_api."],
  ["a.job_api", "job_api()  GET /api/jobs/<id>", "route", 414, "JSON status, log tail, duration and whether results exist. Polled every 1.5 s."],
  ["a.job_stop", "job_stop()  POST /jobs/<id>/stop", "route", 423, "Terminates the running recon.py process and notes who stopped it."],
  ["a.runs_page", "runs_page()  GET /runs", "route", 434, "History of every run (browser, command line, scheduler) and connection tests."],
  ["a.run_detail", "run_detail()  GET /runs/<id>", "route", 440, "Results of one run: summary, mismatched partitions, filterable differences, downloads."],
  ["a.download", "download()  GET /download/<f>", "route", 456, "Sends recon_<id>.xlsx / .html or recon_history.csv; any other name is 404."],
  ["a.config_page", "config_page()  GET /config", "route", 464, "Read-only view of connections (password keys removed) and table pairs."],

  ["a.start_job", "start_job()", "jobs", 134, "Refuses if a job is running, records the job, starts recon.py with subprocess.Popen (argument list, no shell) and a watcher thread."],
  ["a.wait", "start_job → wait() thread", "jobs", 170, "Waits for the recon.py process, maps its exit code to MATCHED / MISMATCH / ERROR / OK / FAILED / STOPPED."],
  ["a.update_job", "update_job()", "jobs", 111, "Under a lock, merges changes into one job and saves."],
  ["a.read_jobs", "read_jobs()", "jobs", 96, "Loads ui_jobs.json (empty list if missing)."],
  ["a.save_jobs", "save_jobs()", "jobs", 104, "Writes the last 500 jobs atomically."],
  ["a._jobs_file", "_jobs_file()", "jobs", 92, "Path of ui_jobs.json in the output folder."],
  ["a.get_job", "get_job()", "jobs", 120, "One job by id."],
  ["a.running_job", "running_job()", "jobs", 124, "The job currently RUNNING, if any."],
  ["a.log_path", "log_path()", "jobs", 128, "Path of ui_logs/<job id>.log."],
  ["a.tail", "tail()", "jobs", 188, "Last 600 lines of a log file."],

  ["a.load_cfg", "load_cfg()", "results", 63, "Reads recon_config.yaml fresh on every call, so edits show without a restart."],
